<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Console</title>
    <style>
      :root {
        --bg: #f5f5f2;
        --card: #ffffff;
        --text: #1d1d1b;
        --muted: #75756f;
        --line: #e2e2dc;
        --accent: #c51a4a;
        --ok: #2f8f5b;
        --warn: #c98a12;
        --bad: #c0392b;
        --bar: #ecece6;
        --code: #f0f0eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151514;
          --card: #1f1f1d;
          --text: #ecece6;
          --muted: #9a9a92;
          --line: #33332f;
          --accent: #e8476f;
          --bar: #2c2c29;
          --code: #121211;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Hiragino Sans",
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      h2 {
        font-size: 13px;
        margin: 0 0 10px;
        color: var(--muted);
        font-weight: 600;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.on {
        background: var(--ok);
      }
      .dot.off {
        background: var(--bad);
      }
      #conn {
        color: var(--muted);
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .big {
        font-size: 26px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 6px;
        background: var(--bar);
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.4s;
      }
      svg.spark {
        width: 100%;
        height: 36px;
        margin-top: 6px;
        display: block;
      }
      section {
        margin-top: 20px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
      }
      button:hover {
        border-color: var(--accent);
      }
      button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        color: var(--bad);
      }
      .mode-controls button {
        min-width: 150px;
        padding: 10px 16px;
      }
      /* カメラを使わないモード。カメラのボタンと見分けられるよう点線の枠にする */
      .mode-controls button.no-camera {
        border-style: dashed;
      }
      .mode-controls button.no-camera.active {
        border-style: solid;
      }
      .preview-options {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .preview-options summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
      }
      .preview-option-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px 16px;
        margin-top: 12px;
      }
      .preview-option {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 8px;
        align-items: center;
      }
      .preview-option label {
        font-size: 12px;
        color: var(--muted);
      }
      .preview-option output {
        font:
          12px ui-monospace,
          Menlo,
          monospace;
      }
      .preview-option input {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: var(--accent);
      }
      .preview-option-actions {
        grid-column: 1 / -1;
      }
      .photo {
        position: relative;
        margin-top: 14px;
        aspect-ratio: 4 / 3;
        background: var(--code);
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--muted);
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .photo img[hidden] {
        display: none;
      }
      .photo.loaded button {
        position: absolute;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        background: color-mix(in srgb, var(--card) 88%, transparent);
        white-space: nowrap;
      }
      #photo-state {
        position: absolute;
        right: 12px;
        bottom: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span class="dot" id="dot"></span>
        <h1 id="title">Pi Console</h1>
        <span id="conn">接続中…</span>
      </header>

      <div class="grid">
        <div class="card">
          <h2>CPU 温度</h2>
          <div class="big" id="temp">–</div>
          <svg
            class="spark"
            id="temp-spark"
            viewBox="0 0 100 36"
            preserveAspectRatio="none"
          ></svg>
        </div>
        <div class="card">
          <h2>CPU 使用率</h2>
          <div class="big" id="cpu">–</div>
          <div class="sub" id="cpu-sub">&nbsp;</div>
          <svg
            class="spark"
            id="cpu-spark"
            viewBox="0 0 100 36"
            preserveAspectRatio="none"
          ></svg>
        </div>
        <div class="card">
          <h2>メモリ</h2>
          <div class="big" id="mem">–</div>
          <div class="sub" id="mem-sub">&nbsp;</div>
          <div class="bar"><div id="mem-bar"></div></div>
        </div>
        <div class="card">
          <h2>ディスク / 起動時間</h2>
          <div class="big" id="disk">–</div>
          <div class="sub" id="disk-sub">&nbsp;</div>
          <div class="bar"><div id="disk-bar"></div></div>
        </div>
      </div>

      <section class="card">
        <h2>モード</h2>
        <div class="row mode-controls">
          <button
            class="no-camera"
            data-mode="eyes"
            title="カメラは使わず、Pi のディスプレイにドットの目を出してまばたきさせる"
          >
            待機
          </button>
          <button
            class="no-camera"
            data-mode="stop"
            title="動いているものを止めて、Pi のディスプレイをログイン画面に戻す"
          >
            デフォルト
          </button>
          <button
            data-mode="preview"
            title="Python を使わず、カメラ映像をそのまま Pi のディスプレイに出す"
          >
            カメラ
          </button>
          <button
            data-mode="peace"
            title="手を認識して撮影する（raspi/pi_peace.py）。起動に 30 秒ほどかかる"
          >
            見守り
          </button>
          <span class="sub" id="mode-state"></span>
        </div>
        <details class="preview-options">
          <summary>カメラの設定</summary>
          <div class="preview-option-grid">
            <div class="preview-option">
              <label for="preview-ev">露出補正</label
              ><output for="preview-ev">0</output>
              <input
                id="preview-ev"
                data-preview-option="ev"
                type="range"
                min="-10"
                max="10"
                step="0.5"
                value="0"
              />
            </div>
            <div class="preview-option">
              <label for="preview-brightness">明るさ</label
              ><output for="preview-brightness">0</output>
              <input
                id="preview-brightness"
                data-preview-option="brightness"
                type="range"
                min="-1"
                max="1"
                step="0.1"
                value="0"
              />
            </div>
            <div class="preview-option">
              <label for="preview-contrast">コントラスト</label
              ><output for="preview-contrast">1</output>
              <input
                id="preview-contrast"
                data-preview-option="contrast"
                type="range"
                min="0"
                max="32"
                step="0.5"
                value="1"
              />
            </div>
            <div class="preview-option">
              <label for="preview-saturation">彩度</label
              ><output for="preview-saturation">1</output>
              <input
                id="preview-saturation"
                data-preview-option="saturation"
                type="range"
                min="0"
                max="32"
                step="0.5"
                value="1"
              />
            </div>
            <div class="preview-option">
              <label for="preview-sharpness">シャープネス</label
              ><output for="preview-sharpness">1</output>
              <input
                id="preview-sharpness"
                data-preview-option="sharpness"
                type="range"
                min="0"
                max="16"
                step="0.5"
                value="1"
              />
            </div>
            <div class="row preview-option-actions">
              <button id="apply-preview-options">カメラに適用</button>
              <button id="reset-preview-options">標準に戻す</button>
              <span class="sub">適用すると「カメラ」を再起動します</span>
            </div>
          </div>
        </details>
        <div class="photo" id="photo">
          <img id="photo-image" alt="Piで撮影した最新の写真" hidden />
          <button id="latest-photo">最新の写真を取得</button>
          <span class="sub" id="photo-state"></span>
        </div>
      </section>

      <section class="card">
        <h2>学習データ</h2>
        <div class="row mode-controls">
          <button
            data-mode="record"
            title="見守りと同じ映像を Pi の ~/peace-dataset/recordings/ に保存する。止めるときは「デフォルト」"
          >
            録画
          </button>
          <button id="pull-recordings">録画を Mac に取り込む</button>
          <span class="sub" id="recordings-state"></span>
        </div>
      </section>

      <section class="card">
        <h2>電源</h2>
        <div class="row">
          <button class="danger" data-power="reboot">再起動</button>
          <button class="danger" data-power="poweroff">シャットダウン</button>
          <span class="sub" id="power-state"
            >シャットダウン後は基板の LED が消えてから電源を抜く</span
          >
        </div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const hist = { temp: [], cpu: [] };
      const HISTORY_LEN = 60;

      function spark(svg, values, min, max) {
        if (values.length < 2) return;
        const pts = values.map((v, i) => {
          const x = (i / (HISTORY_LEN - 1)) * 100;
          const y =
            34 - ((Math.min(Math.max(v, min), max) - min) / (max - min)) * 32;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        svg.innerHTML = `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)"
    stroke-width="1.5" vector-effect="non-scaling-stroke" />`;
      }

      function push(key, value) {
        if (value == null) return;
        hist[key].push(value);
        if (hist[key].length > HISTORY_LEN) hist[key].shift();
      }

      const mb = (kb) => (kb / 1024).toFixed(0);
      const gb = (b) => (b / 1024 ** 3).toFixed(1);

      function uptimeText(s) {
        const d = Math.floor(s / 86400),
          h = Math.floor((s % 86400) / 3600),
          m = Math.floor((s % 3600) / 60);
        return (d ? `${d}日 ` : "") + `${h}時間 ${m}分`;
      }

      let refreshing = false;

      async function refresh() {
        if (refreshing) return;
        refreshing = true;
        try {
          await updateStatus();
        } finally {
          refreshing = false;
        }
      }

      async function updateStatus() {
        let s;
        try {
          s = await (await fetch("/api/status")).json();
        } catch {
          s = { online: false, error: "パネルの server.mjs が止まっています" };
        }
        $("dot").className = "dot " + (s.online ? "on" : "off");
        if (!s.online) {
          $("conn").textContent = "オフライン: " + s.error;
          return;
        }
        $("title").textContent = s.hostname;
        $("conn").textContent = "更新 " + new Date().toLocaleTimeString();

        push("temp", s.temp_c);
        push("cpu", s.cpu_percent);
        $("temp").textContent = s.temp_c.toFixed(1) + " ℃";
        spark($("temp-spark"), hist.temp, 30, 85);

        $("cpu").textContent =
          s.cpu_percent == null ? "…" : s.cpu_percent + " %";
        $("cpu-sub").textContent =
          `load ${s.load.join(" ")}` +
          (s.freq_mhz ? ` · ${s.freq_mhz} MHz` : "");
        spark($("cpu-spark"), hist.cpu, 0, 100);

        const used = s.mem_total_kb - s.mem_available_kb;
        $("mem").textContent = `${mb(used)} / ${mb(s.mem_total_kb)} MB`;
        $("mem-sub").textContent =
          `swap ${mb(s.swap_used_kb)} / ${mb(s.swap_total_kb)} MB`;
        $("mem-bar").style.width = (100 * used) / s.mem_total_kb + "%";

        $("disk").textContent = `${gb(s.disk_used)} / ${gb(s.disk_total)} GB`;
        $("disk-sub").textContent = "起動から " + uptimeText(s.uptime_s);
        $("disk-bar").style.width = (100 * s.disk_used) / s.disk_total + "%";

        const mode = s.peace
          ? "peace"
          : s.preview
            ? "preview"
            : s.record
              ? "record"
              : s.eyes
                ? "eyes"
                : "stop";
        document
          .querySelectorAll("[data-mode]")
          .forEach((button) =>
            button.classList.toggle("active", button.dataset.mode === mode),
          );
        if (!pulling) {
          const { count, bytes } = s.recordings;
          $("recordings-state").textContent =
            `Pi の録画: ${count} 本 / ${(bytes / 1024 ** 2).toFixed(0)} MB` +
            (s.record ? "（録画中）" : "") +
            (pullResult ? ` · ${pullResult}` : "");
        }
        $("pull-recordings").disabled = s.record || pulling;
      }

      async function post(path, body) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        return res.json();
      }

      document.querySelectorAll("[data-power]").forEach((b) =>
        b.addEventListener("click", async () => {
          if (!confirm(`本当に${b.textContent}しますか？`)) return;
          const r = await post("/api/power", { action: b.dataset.power });
          if (r.code !== 0)
            $("power-state").textContent = "失敗: " + (r.stderr || r.error);
        }),
      );

      let photoUrl = null;

      async function loadLatestPhoto() {
        $("latest-photo").disabled = true;
        $("photo-state").textContent = "取得中…";
        try {
          const res = await fetch(`/api/photos/latest?t=${Date.now()}`);
          if (!res.ok) throw new Error((await res.json()).error);
          if (photoUrl) URL.revokeObjectURL(photoUrl);
          photoUrl = URL.createObjectURL(await res.blob());
          $("photo-image").src = photoUrl;
          $("photo-image").hidden = false;
          $("photo").classList.add("loaded");
          $("photo-state").textContent = "取得済み";
        } catch (e) {
          $("photo-state").textContent = "失敗: " + e.message;
        } finally {
          $("latest-photo").disabled = false;
        }
      }

      document.querySelectorAll("[data-mode]").forEach((button) =>
        button.addEventListener("click", async () => {
          const action = button.dataset.mode;
          $("mode-state").textContent =
            action === "stop" ? "停止中…" : "起動中…";
          const result = await post("/api/mode", {
            action,
            ...(action === "preview" ? { options: previewOptions() } : {}),
          });
          $("mode-state").textContent =
            result.code === 0 ? "" : "失敗: " + (result.stderr || result.error);
          refresh();
        }),
      );

      const previewDefaults = {
        ev: 0,
        brightness: 0,
        contrast: 1,
        saturation: 1,
        sharpness: 1,
      };

      function previewOptions() {
        return Object.fromEntries(
          [...document.querySelectorAll("[data-preview-option]")].map(
            (input) => [input.dataset.previewOption, Number(input.value)],
          ),
        );
      }

      document.querySelectorAll("[data-preview-option]").forEach((input) => {
        const output = document.querySelector(`output[for="${input.id}"]`);
        input.addEventListener("input", () => {
          output.value = input.value;
        });
      });

      $("apply-preview-options").addEventListener("click", async () => {
        $("mode-state").textContent = "設定を適用中…";
        const result = await post("/api/mode", {
          action: "preview",
          options: previewOptions(),
        });
        $("mode-state").textContent =
          result.code === 0 ? "" : "失敗: " + (result.stderr || result.error);
        refresh();
      });

      $("reset-preview-options").addEventListener("click", () => {
        for (const [name, value] of Object.entries(previewDefaults)) {
          const input = document.querySelector(
            `[data-preview-option="${name}"]`,
          );
          input.value = value;
          input.dispatchEvent(new Event("input"));
        }
      });

      $("latest-photo").addEventListener("click", loadLatestPhoto);

      let pulling = false;
      let pullResult = ""; // 状態の更新で消えないように、最後の取り込み結果を覚えておく

      $("pull-recordings").addEventListener("click", async () => {
        pulling = true;
        $("pull-recordings").disabled = true;
        $("recordings-state").textContent =
          "取り込み中…（大きいと数分かかります）";
        try {
          const res = await fetch("/api/recordings/pull", { method: "POST" });
          const result = await res.json();
          if (!res.ok) throw new Error(result.error);
          const mbTotal =
            result.files.reduce((sum, f) => sum + f.bytes, 0) / 1024 ** 2;
          pullResult = `Mac に ${result.files.length} 本 / ${mbTotal.toFixed(0)} MB（pi-console/recordings/）`;
        } catch (e) {
          pullResult = "取り込み失敗: " + e.message;
        } finally {
          pulling = false;
          $("pull-recordings").disabled = false;
          refresh();
        }
      });

      refresh();
      setInterval(refresh, 3000);
    </script>
  </body>
</html>
