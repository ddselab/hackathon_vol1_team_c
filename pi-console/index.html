<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Console</title>
    <style>
      :root {
        --bg: #f5f5f2;
        --card: #ffffff;
        --text: #1d1d1b;
        --muted: #75756f;
        --line: #e2e2dc;
        --accent: #c51a4a;
        --ok: #2f8f5b;
        --warn: #c98a12;
        --bad: #c0392b;
        --bar: #ecece6;
        --code: #f0f0eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151514;
          --card: #1f1f1d;
          --text: #ecece6;
          --muted: #9a9a92;
          --line: #33332f;
          --accent: #e8476f;
          --bar: #2c2c29;
          --code: #121211;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Hiragino Sans",
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      h2 {
        font-size: 13px;
        margin: 0 0 10px;
        color: var(--muted);
        font-weight: 600;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.on {
        background: var(--ok);
      }
      .dot.off {
        background: var(--bad);
      }
      #conn {
        color: var(--muted);
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .big {
        font-size: 26px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 6px;
        background: var(--bar);
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.4s;
      }
      svg.spark {
        width: 100%;
        height: 36px;
        margin-top: 6px;
        display: block;
      }
      section {
        margin-top: 20px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
      }
      button:hover {
        border-color: var(--accent);
      }
      button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        color: var(--bad);
      }
      .mode-controls button {
        min-width: 150px;
        padding: 10px 16px;
      }
      /* カメラを使わないモード。カメラのボタンと見分けられるよう点線の枠にする */
      .mode-controls button.no-camera {
        border-style: dashed;
      }
      .mode-controls button.no-camera.active {
        border-style: solid;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span class="dot" id="dot"></span>
        <h1 id="title">Pi Console</h1>
        <span id="conn">接続中…</span>
      </header>

      <div class="grid">
        <div class="card">
          <h2>CPU 温度</h2>
          <div class="big" id="temp">–</div>
          <svg
            class="spark"
            id="temp-spark"
            viewBox="0 0 100 36"
            preserveAspectRatio="none"
          ></svg>
        </div>
        <div class="card">
          <h2>CPU 使用率</h2>
          <div class="big" id="cpu">–</div>
          <div class="sub" id="cpu-sub">&nbsp;</div>
          <svg
            class="spark"
            id="cpu-spark"
            viewBox="0 0 100 36"
            preserveAspectRatio="none"
          ></svg>
        </div>
        <div class="card">
          <h2>メモリ</h2>
          <div class="big" id="mem">–</div>
          <div class="sub" id="mem-sub">&nbsp;</div>
          <div class="bar"><div id="mem-bar"></div></div>
        </div>
        <div class="card">
          <h2>ディスク / 起動時間</h2>
          <div class="big" id="disk">–</div>
          <div class="sub" id="disk-sub">&nbsp;</div>
          <div class="bar"><div id="disk-bar"></div></div>
        </div>
      </div>

      <section class="card">
        <h2>モード</h2>
        <div class="row mode-controls">
          <button
            class="no-camera"
            data-mode="eyes"
            title="カメラは使わず、Pi のディスプレイにドットの目を出してまばたきさせる"
          >
            目
          </button>
          <button
            class="no-camera"
            data-mode="stop"
            title="動いているものを止めて、Pi のディスプレイをログイン画面に戻す"
          >
            デフォルト
          </button>
          <button
            data-mode="peace"
            title="両手ピースで撮影し、Slack に投稿する（raspi/pi_peace.py）。起動に 30 秒ほどかかる"
          >
            見守り
          </button>
          <span class="sub" id="mode-state"></span>
        </div>
      </section>

      <section class="card">
        <h2>電源</h2>
        <div class="row">
          <button class="danger" data-power="reboot">再起動</button>
          <button class="danger" data-power="poweroff">シャットダウン</button>
          <span class="sub" id="power-state"
            >シャットダウン後は基板の LED が消えてから電源を抜く</span
          >
        </div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const hist = { temp: [], cpu: [] };
      const HISTORY_LEN = 60;

      function spark(svg, values, min, max) {
        if (values.length < 2) return;
        const pts = values.map((v, i) => {
          const x = (i / (HISTORY_LEN - 1)) * 100;
          const y =
            34 - ((Math.min(Math.max(v, min), max) - min) / (max - min)) * 32;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        svg.innerHTML = `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)"
    stroke-width="1.5" vector-effect="non-scaling-stroke" />`;
      }

      function push(key, value) {
        if (value == null) return;
        hist[key].push(value);
        if (hist[key].length > HISTORY_LEN) hist[key].shift();
      }

      const mb = (kb) => (kb / 1024).toFixed(0);
      const gb = (b) => (b / 1024 ** 3).toFixed(1);

      function uptimeText(s) {
        const d = Math.floor(s / 86400),
          h = Math.floor((s % 86400) / 3600),
          m = Math.floor((s % 3600) / 60);
        return (d ? `${d}日 ` : "") + `${h}時間 ${m}分`;
      }

      let refreshing = false;

      async function refresh() {
        if (refreshing) return;
        refreshing = true;
        try {
          await updateStatus();
        } finally {
          refreshing = false;
        }
      }

      async function updateStatus() {
        let s;
        try {
          s = await (await fetch("/api/status")).json();
        } catch {
          s = { online: false, error: "パネルの server.mjs が止まっています" };
        }
        $("dot").className = "dot " + (s.online ? "on" : "off");
        if (!s.online) {
          $("conn").textContent = "オフライン: " + s.error;
          return;
        }
        $("title").textContent = s.hostname;
        $("conn").textContent = "更新 " + new Date().toLocaleTimeString();

        push("temp", s.temp_c);
        push("cpu", s.cpu_percent);
        $("temp").textContent = s.temp_c.toFixed(1) + " ℃";
        spark($("temp-spark"), hist.temp, 30, 85);

        $("cpu").textContent =
          s.cpu_percent == null ? "…" : s.cpu_percent + " %";
        $("cpu-sub").textContent =
          `load ${s.load.join(" ")}` +
          (s.freq_mhz ? ` · ${s.freq_mhz} MHz` : "");
        spark($("cpu-spark"), hist.cpu, 0, 100);

        const used = s.mem_total_kb - s.mem_available_kb;
        $("mem").textContent = `${mb(used)} / ${mb(s.mem_total_kb)} MB`;
        $("mem-sub").textContent =
          `swap ${mb(s.swap_used_kb)} / ${mb(s.swap_total_kb)} MB`;
        $("mem-bar").style.width = (100 * used) / s.mem_total_kb + "%";

        $("disk").textContent = `${gb(s.disk_used)} / ${gb(s.disk_total)} GB`;
        $("disk-sub").textContent = "起動から " + uptimeText(s.uptime_s);
        $("disk-bar").style.width = (100 * s.disk_used) / s.disk_total + "%";

        const mode = s.peace ? "peace" : s.eyes ? "eyes" : "stop";
        document
          .querySelectorAll("[data-mode]")
          .forEach((button) =>
            button.classList.toggle("active", button.dataset.mode === mode),
          );
      }

      async function post(path, body) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        return res.json();
      }

      document.querySelectorAll("[data-power]").forEach((b) =>
        b.addEventListener("click", async () => {
          if (!confirm(`本当に${b.textContent}しますか？`)) return;
          const r = await post("/api/power", { action: b.dataset.power });
          if (r.code !== 0)
            $("power-state").textContent = "失敗: " + (r.stderr || r.error);
        }),
      );

      document.querySelectorAll("[data-mode]").forEach((button) =>
        button.addEventListener("click", async () => {
          const action = button.dataset.mode;
          $("mode-state").textContent =
            action === "stop" ? "停止中…" : "起動中…";
          const result = await post("/api/mode", { action });
          $("mode-state").textContent =
            result.code === 0 ? "" : "失敗: " + (result.stderr || result.error);
          refresh();
        }),
      );

      refresh();
      setInterval(refresh, 3000);
    </script>
  </body>
</html>
