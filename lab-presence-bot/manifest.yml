# Slack App を「From an app manifest」で作るときに貼り付ける設定
# redirect_urls の URL は自分の PUBLIC_BASE_URL に書き換えること
display_information:
  name: 研究室在室Bot
  description: 靴箱カメラと連動して研究室の在室状況をお知らせします
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: lab-presence
    always_online: true
  slash_commands:
    - command: /lab
      description: 研究室の在室状況の表示・靴箱の登録
      usage_hint: "[status | register 靴箱番号 | connect | help]"
      should_escape: false
oauth_config:
  redirect_urls:
    - https://xxxx.ngrok-free.app/slack/oauth_redirect
  scopes:
    bot:
      - chat:write
      - commands
      - users:read
    user:
      - users.profile:read
      - users.profile:write
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
